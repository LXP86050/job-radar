name: Test Email (temporary)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Send a test zip digest via Gmail SMTP
        run: |
          python -c "
          from pathlib import Path
          import tempfile
          from src.send_digest import _build_zip
          from src.mailer import send_email

          pdfs = sorted(Path('state/tailored/2026-08-12').glob('*.pdf'))[:3]
          entries = [({'title': p.stem}, p, 90) for p in pdfs]
          print('using real PDFs:', [p.name for p in pdfs])

          with tempfile.TemporaryDirectory() as tmp:
              zp = Path(tmp) / 'test.zip'
              _build_zip(entries, zp)
              send_email(
                  'Job Radar — ZIP format test',
                  '<h2>Zip format test</h2><p>Unzip: one folder per match, '
                  'each containing Lokesh_Pulivarthi.pdf.</p>',
                  [zp],
              )
          print('test zip email sent')
          "
