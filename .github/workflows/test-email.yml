name: Test Email (temporary)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Send a test email via Gmail SMTP
        run: |
          python -c "
          from src.mailer import send_email
          send_email(
              'Job Radar — Gmail SMTP test ✅',
              '<h2>It works.</h2><p>Your job-radar email now sends through Gmail SMTP. '
              'You can delete this test workflow.</p>',
          )
          print('test email sent')
          "
